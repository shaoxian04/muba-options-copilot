# The whole suite, on every push -- no network, no chain, no wallet (issue #14).
#
# The environment is scrubbed rather than trusted: there is no RPC URL and no key in CI,
# so a test that ever forgot to stub the Thetanuts client fails here loudly instead of
# quietly dialling mainnet with whatever happens to be configured on a laptop.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck both workspaces
        run: npm run typecheck

      # Runs the same suite as `test:unit` and additionally enforces the coverage
      # thresholds in vitest.config.ts. Nothing measured coverage before, so the house
      # rule of 80% was an impression rather than a number; this makes a regression fail
      # the build instead of going unnoticed.
      - name: Unit and contract tests, with coverage thresholds
        run: npm run test:coverage

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # The Forecast suites are written against `node:test` rather than Vitest, so they
      # need their own step -- otherwise they are green by never having run.
      - name: Forecast tests
        run: npm run test:node

      # The agents suite had exactly that problem: `test:py` is in `npm test` but had no
      # CI step, so apps/agents was green by never having run -- including
      # test_profiles.py, which covers the Strategy Agent boundary ADR-0005 depends on.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agents tests
        run: |
          python -m venv apps/agents/.venv
          apps/agents/.venv/bin/python -m pip install --quiet -r apps/agents/requirements.txt
          npm run test:py

      # Chromium only. The suite asserts on rendered behaviour and network traffic, not
      # on how any particular engine paints, so a second browser would buy minutes and
      # no coverage.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the failure trail
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
