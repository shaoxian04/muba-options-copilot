<!--
  PROTOTYPE - throwaway. Not the real frontend. Successor experiment to
  prototype-copilot.html, which settled the single-asset Deck.

  QUESTION IT ANSWERS: does the refactored surface read as a game without becoming a
  casino (ADR-0009), and is a 16-22 bar Maker Depth ladder dense enough to look good?

  Three structurally different variants on one page, switchable with the bar at the
  bottom or the arrow keys:

    ?variant=A  Board   - depth chart is the hero, terminal density, cards beneath
    ?variant=B  Ladder  - cards and depth share one strike axis, row for row
    ?variant=C  Slip    - sportsbook odds tiles, depth demoted to supporting evidence

  DATA IS REAL. Every strike, premium, IV and depth below is the live Thetanuts
  OptionBook on Base, read into prototype-book.json and inlined here. 258 buyable
  USDC-collateral orders across six underlyings. Implied Chance is computed ON THIS PAGE
  from the maker's own IV via N(+/-d2) - that is a prototype liberty; in the real
  surface the server derives it and ships the string (ADR-0006).

  Call/put colour is blue/orange, NOT green/red. Measured with the repo's own
  apps/web/tests/support/colour.ts: green/red separates by dE 5.5 under deuteranopia
  against a bar of 8; blue/orange separates by dE 67.0.
-->
<title>Deck v2 - prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Martian+Mono:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#0A0E14; --well:#06090D; --surface:#141B24; --surface-2:#1B242F; --surface-3:#222E3A;
  --line:#232F3B; --line-2:#1A242E;
  --ink:#E9EFF5; --ink-2:#96A6B6; --ink-3:#5F707E;
  --call:#3987e5; --call-dim:#1e4a7d; --call-soft:#12283f;
  --put:#f0883e; --put-dim:#8a4b1d; --put-soft:#3a2313;
  --hue:#3987e5; --hue-soft:#12283f;
  --r0:#104281; --r1:#184f95; --r2:#1c5cab; --r3:#2a78d6; --r4:#5598e7; --r5:#86b6ef;
  --warn:#f5b02e;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --num:"Martian Mono","IBM Plex Mono",ui-monospace,monospace;
  --lift:0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);overflow:hidden;
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:2px solid var(--hue);outline-offset:2px;border-radius:8px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:322px 1fr;height:100vh}

/* ---------- chat (shared, unchanged by variant) ---------- */
.chat{background:var(--well);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chat header{padding:18px 20px 14px;border-bottom:1px solid var(--line-2)}
.chat h1{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.chat h1 b{color:var(--ink);font-weight:600}
.log{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;padding:10px 13px;border-radius:12px;font-size:13.5px}
.msg.them{background:var(--surface);border:1px solid var(--line)}
.msg.me{background:var(--hue-soft);border:1px solid var(--call-dim);align-self:flex-end}
.msg small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.seeds{padding:14px 20px 18px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.seeds span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.seed{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  font-size:13px;color:var(--ink-2);transition:.12s}
.seed:hover{border-color:var(--call-dim);color:var(--ink);background:var(--surface-2)}

/* ---------- rig ---------- */
.rig{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
/* The rig scrolls; its children must not be squeezed to fit it. Without this the
   ticker rail and hero collapse to nothing instead of pushing the page taller. */
.rig > *{flex:none}
.rig::-webkit-scrollbar{width:10px;height:10px}
.rig::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

/* ---------- shared atoms ---------- */
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  font-size:12.5px;color:var(--ink-2);transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:600}
.chip.up[aria-pressed="true"]{background:var(--call);border-color:var(--call);color:#fff}
.chip.down[aria-pressed="true"]{background:var(--put);border-color:var(--put);color:#1a0f06}
.lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rule{height:1px;background:var(--line-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.pill.call{background:var(--call-soft);color:#8dbdf0}
.pill.put{background:var(--put-soft);color:#f2ac74}
.ticks{font-family:var(--num);font-size:11px;color:var(--warn);font-weight:600}
.ticks.cold{color:var(--ink-2);font-weight:500}

.btn{padding:10px 20px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.12s}
.btn.primary{background:var(--ink);color:var(--ground)}
.btn.primary:hover{background:#fff}
.btn.ghost{border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}

/* ================= VARIANT A - BOARD ================= */
.A .top{display:grid;grid-template-columns:230px 1fr;gap:0;flex:1;min-height:0}
.A .watch{border-right:1px solid var(--line);background:var(--well);padding:12px 0;overflow:auto}
.A .watch .lbl{padding:0 16px 10px}
.A .wrow{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:10px 16px;align-items:center;
  border-left:2px solid transparent;transition:.12s}
.A .wrow:hover{background:var(--surface)}
.A .wrow[aria-pressed="true"]{background:var(--surface-2);border-left-color:var(--call)}
.A .wsym{font-weight:700;font-size:14px;letter-spacing:.02em}
.A .wpx{font-family:var(--num);font-size:13px;text-align:right;color:var(--ink)}
.A .wrow .mk{grid-row:1/3}
.A .wbar{grid-column:2/-1;height:4px;border-radius:2px;background:var(--line);display:flex;overflow:hidden;margin-top:3px}
.A .wbar i{display:block;height:100%}
.A .wn{grid-column:2/-1;font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.A .main{display:flex;flex-direction:column;min-width:0}
.A .hero{padding:16px 22px 10px}
.A .heroHead{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.A .heroHead h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.A .heroHead .spot{font-family:var(--num);font-size:15px;color:var(--ink)}
.A .legend{display:flex;gap:14px;margin-left:auto;font-size:11.5px;color:var(--ink-2);align-items:center}
.A .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.A .cardsWrap{padding:4px 22px 18px;border-top:1px solid var(--line-2)}
.A .chips{display:flex;gap:8px;align-items:center;padding:14px 0 12px;flex-wrap:wrap}
.A .chips .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.A .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px;padding-bottom:8px;max-width:1180px}
.A .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  display:flex;flex-direction:column;gap:8px;transition:.13s;position:relative;overflow:hidden}
.A .card:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.A .card[aria-pressed="true"]{border-color:var(--call);background:var(--surface-2);box-shadow:var(--lift)}
.A .card .rail{position:absolute;left:0;top:0;bottom:0;width:3px}
.A .card .k{font-family:var(--num);font-size:19px;font-weight:700;letter-spacing:-.03em}
.A .card .chance{display:flex;align-items:baseline;gap:6px}
.A .card .chance b{font-family:var(--num);font-size:15px;font-weight:600}
.A .card dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:11.5px}
.A .card dt{color:var(--ink-3)}
.A .card dd{margin:0;font-family:var(--num);font-size:11.5px;text-align:right}

/* ================= VARIANT B - LADDER ================= */
.B .head{padding:16px 24px 0}
.B .assets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.B .abtn{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:1px 9px;padding:8px 14px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface);transition:.12s;min-width:118px}
.B .abtn .mk{grid-row:1/3}
.B .abtn:hover{border-color:var(--ink-3)}
.B .abtn[aria-pressed="true"]{border-color:var(--call);background:var(--surface-2)}
.B .abtn b{font-size:13.5px;letter-spacing:.03em}
.B .abtn span{font-family:var(--num);font-size:12px;color:var(--ink-2)}
.B .chips{display:flex;gap:8px;align-items:center;padding-bottom:14px;flex-wrap:wrap}
.B .chips .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.B .ladder{padding:0 24px 20px;min-width:0}
.B .lhead{display:grid;grid-template-columns:1fr 300px;gap:20px;padding:0 0 8px;position:sticky;top:0;
  background:var(--ground);z-index:2}
.B .lrow{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:stretch;margin-bottom:6px}
.B .lcard{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 15px;transition:.12s;
  position:relative;overflow:hidden}
.B .lcard:hover{border-color:var(--ink-3)}
.B .lcard[aria-pressed="true"]{border-color:var(--call);background:var(--surface-2)}
.B .lcard.empty{background:transparent;border-color:var(--line-2);cursor:default;padding:2px 15px;
  grid-template-columns:96px 1fr;align-items:center}
.B .lcard.empty .k{font-size:12.5px;font-weight:500;color:var(--ink-3)}
.B .lrow.thin{margin-bottom:2px}
.B .lrow.thin .depthrow{padding:0 12px;background:transparent;border-color:transparent}
.B .lrow.thin .dbar{height:14px}
.B .lrow.thin .dhalf{height:7px}
.B .lrow.thin .dmid{height:10px}
.B .lcard .rail{position:absolute;left:0;top:0;bottom:0;width:3px}
.B .lcard .k{font-family:var(--num);font-size:17px;font-weight:700;letter-spacing:-.03em}
.B .lcard .k small{display:block;font-family:"IBM Plex Sans";font-size:10.5px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.B .lcard .mid{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
.B .lcard .mid div{display:flex;flex-direction:column}
.B .lcard .mid b{font-family:var(--num);font-size:13.5px;font-weight:600}
.B .lcard .mid span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.B .depthrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:11px;padding:0 12px}
.B .dbar{flex:1;display:flex;align-items:center;height:26px}
.B .dhalf{flex:1;display:flex;height:11px}
.B .dhalf.l{justify-content:flex-end}
.B .dhalf i{display:block;height:100%;border-radius:2px}
.B .dmid{width:1px;height:18px;background:var(--line);flex:none}
.B .dnum{font-family:var(--num);font-size:10.5px;color:var(--ink-3);width:52px}
.B .dnum.r{text-align:right}
.B .spotband{display:grid;grid-template-columns:1fr 300px;gap:20px;margin:2px 0 8px;align-items:center}
.B .spotband .line{height:1px;background:linear-gradient(90deg,transparent,var(--warn))}
.B .spotband .tag{font-family:var(--num);font-size:11px;color:var(--warn);font-weight:600;white-space:nowrap}

/* ================= VARIANT C - SLIP ================= */
.C{background:
  radial-gradient(1100px 420px at 68% -8%, rgba(57,135,229,.13), transparent 62%),
  radial-gradient(760px 340px at 8% 4%, rgba(240,136,62,.07), transparent 60%),
  var(--ground)}

/* --- ticker rail --- */
.C .rail-top{display:flex;gap:0;border-bottom:1px solid var(--line);background:rgba(6,9,13,.72);
  overflow-x:auto;backdrop-filter:blur(6px)}
.C .trow{display:grid;grid-template-columns:auto 1fr;gap:2px 11px;padding:13px 20px 11px;
  border-right:1px solid var(--line-2);border-bottom:2px solid transparent;transition:.16s;min-width:174px}
.C .trow:hover{background:var(--surface)}
.C .trow[aria-pressed="true"]{background:var(--surface);border-bottom-color:var(--ink)}
.C .trow .mk{grid-row:1/3;align-self:center}
.C .trow b{font-size:14px;font-weight:700;letter-spacing:.05em;line-height:1.15}
.C .trow span{font-family:var(--num);font-size:12.5px;color:var(--ink-2);line-height:1.15}
.C .trow .sp{grid-column:1/-1;height:3px;border-radius:2px;display:flex;overflow:hidden;
  background:var(--line);margin-top:6px}
.C .trow .sp i{display:block;height:100%}

/* --- hero --- */
.C .hero{position:relative;padding:24px 30px 20px;overflow:hidden;border-bottom:1px solid var(--line-2)}
.C .hero .ghost{position:absolute;right:26px;top:-24px;opacity:.05;pointer-events:none}
.C .hero h2{margin:0;font-size:32px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:13px}
.C .hero h2 .px{font-family:var(--num);font-size:26px;font-weight:600;color:var(--ink-2);letter-spacing:-.04em}
.C .hero .move{margin:9px 0 0;font-size:13.5px;color:var(--ink-2);max-width:640px}
.C .hero .move b{color:var(--ink);font-weight:600;font-family:var(--num)}

/* --- body --- */
.C .body{padding:18px 30px 26px}
.C .chips{display:flex;gap:8px;align-items:center;padding-bottom:18px;flex-wrap:wrap}
.C .chips .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.C .chips .dead{opacity:.32;cursor:not-allowed}

.C .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.C .tile{position:relative;overflow:hidden;text-align:left;
  background:linear-gradient(168deg,var(--surface-2) 0%,var(--surface) 46%);
  border:1px solid var(--line);border-radius:17px;padding:16px 16px 11px;
  display:flex;flex-direction:column;gap:11px;transition:transform .16s,border-color .16s}
.C .tile:hover{border-color:var(--ink-3);transform:translateY(-3px)}
.C .tile[aria-pressed="true"]{border-color:var(--call);transform:translateY(-3px);box-shadow:var(--lift)}
.C .tile .rail{position:absolute;left:0;top:0;bottom:0;width:3px}
.C .tile .wm{position:absolute;left:0;right:0;bottom:31px;height:54px;pointer-events:none;display:block}
.C .tile .wm .spark{width:100%;height:100%;display:block}

.C .gauge{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.C .gauge .g-txt{display:flex;flex-direction:column;gap:2px}
.C .gauge .g-txt small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.C .gauge .g-txt b{font-size:13px;font-weight:600}

.C .claim{font-family:var(--num);font-size:19px;font-weight:700;letter-spacing:-.035em;
  color:var(--ink-3);position:relative;z-index:1}
.C .claim b{color:var(--ink);font-weight:700}

.C .mult{display:flex;align-items:baseline;gap:9px;position:relative;z-index:1}
.C .mult .x{font-family:var(--num);font-size:25px;font-weight:700;letter-spacing:-.06em;color:var(--ink);line-height:1}
.C .mult .x.nil{color:var(--ink-3)}
.C .be{display:flex;align-items:baseline;gap:7px;position:relative;z-index:1;margin-top:-5px}
.C .be span{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.C .be b{font-family:var(--num);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.C .be em{font-style:normal;font-family:var(--num);font-size:11px;color:var(--ink-3)}
.C .be.lead b{color:var(--ink)}
.C .be.lead em{color:var(--warn)}
.C .mult .to{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.C .mult .to b{color:var(--ink-2);font-weight:600;font-family:var(--num)}

.C .foot{display:flex;align-items:center;gap:7px;padding-top:9px;margin-top:auto;
  border-top:1px solid var(--line-2);position:relative;z-index:1}
.C .heat{flex:none;width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:block}
.C .heat i{display:block;height:100%;background:linear-gradient(90deg,var(--r2),var(--r5))}
.C .hn{font-size:10.5px;color:var(--ink-3)}
.C .held{margin-left:auto;font-family:var(--num);font-size:10px;font-weight:700;color:#1a0f06;
  background:var(--warn);border-radius:999px;padding:2px 7px;letter-spacing:-.02em}
.C .foot .ticks{margin-left:auto}
.C .held + .ticks{margin-left:7px}

.C .evidence{margin-top:26px;background:rgba(6,9,13,.55);border:1px solid var(--line);
  border-radius:17px;padding:16px 20px 12px}
.C .evidence header{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.C .evidence h3{margin:0;font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.C .evidence .key{margin-left:auto;display:flex;gap:14px;font-size:11.5px;color:var(--ink-2)}
.C .evidence .key i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.C .evidence .key i.dot{border-radius:999px;background:var(--warn)}
.C .dread{font-size:11.5px;color:var(--ink-2);font-family:var(--num);min-height:16px}
.C .dread b{color:var(--ink)}
.C .dread i{width:8px;height:8px;border-radius:2px;display:inline-block;margin:0 5px 0 11px}
.C .dread em{font-style:normal;color:var(--warn);margin-left:11px}
circle.oi{fill:var(--warn);opacity:.85}
.xhair{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3;pointer-events:none;transition:opacity .1s}

@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.C .evidence rect.bar{animation:grow .42s cubic-bezier(.2,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){
  .C .evidence rect.bar{animation:none}
  .C .tile{transition:none}
}

/* ---------- depth chart (shared svg styling) ---------- */
.axis{stroke:var(--line);stroke-width:1}
.gridline{stroke:var(--line-2);stroke-width:1}
.tick{fill:var(--ink-3);font-family:var(--mono);font-size:9.5px}
.spotline{stroke:var(--warn);stroke-width:1;stroke-dasharray:3 3}
.spotlbl{fill:var(--warn);font-family:var(--num);font-size:10px;font-weight:600}
.bar{transition:opacity .15s}
.bar.dim{opacity:.3}
.outside{fill:var(--ink-3);font-size:10.5px;font-family:"IBM Plex Sans"}
.axlbl{fill:var(--ink-3);font-family:"IBM Plex Sans";font-size:9.5px;font-weight:600;letter-spacing:.13em}
.axttl{fill:var(--ink-3);font-family:"IBM Plex Sans";font-size:9px;font-weight:600;letter-spacing:.16em}


/* ================= VARIANT D - PLAIN (beginner framing, reuses .C shell) ============ */
.D .tile.d{gap:14px;padding:17px 17px 13px}
.D .tile.d .gauge{gap:11px}
.D .must{position:relative;z-index:1;display:flex;flex-direction:column;gap:1px}
.D .must .lead{font-size:12.5px;color:var(--ink-2)}
.D .must .pc{font-family:var(--num);font-size:30px;font-weight:700;letter-spacing:-.05em;
  line-height:1.05;color:var(--ink)}
.D .must .pc.sm{font-size:23px}
.D .must .sub{font-size:11.5px;color:var(--ink-3);font-family:var(--num);letter-spacing:-.01em}
.D .must .sub .ticks{font-size:11.5px;font-weight:600}
.D .rw{display:flex;align-items:flex-end;gap:13px;position:relative;z-index:1;
  padding:11px 13px;border-radius:12px;background:var(--well);border:1px solid var(--line-2)}
.D .rw div{display:flex;flex-direction:column;gap:1px}
.D .rw small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

  if (!best) return;
  var line = document.getElementById("xh"), bx = CHART.x(best.strike);
  line.setAttribute("x1", bx); line.setAttribute("x2", bx); line.setAttribute("opacity", "1");
  if (out) {
    var n = oiAt(CHART.asset, best.strike);
    out.innerHTML = "<b>" + usd(best.strike) + "</b>" +
      (best.call ? '<i style="background:var(--call)"></i>' + big(best.call) : "") +
      (best.put ? '<i style="background:var(--put)"></i>' + big(best.put) : "") +
      (n ? "<em>" + n + " held</em>" : "");
  }
}
function xhairOff() {
  var l = document.getElementById("xh"), out = document.getElementById("dread");
  if (l) l.setAttribute("opacity", "0");
  if (out) out.innerHTML = "";
}

/* ---------- state ---------- */
var S = {
  variant: (new URLSearchParams(location.search).get("variant") || "A").toUpperCase(),
  asset: "ETH",
  dir: "DOWN",
  days: 1,
  picked: null,
  modal: null,
  size: STAKE,
  spent: 0,
  receipt: null,
  rfqForm: null
};
var RISK_BUDGET = 25;
if (!VARIANTS.some(function (v) { return v.key === S.variant; })) S.variant = "A";

/** The expiry with the most to look at - 1 day is routinely the thinnest cell. */
function bestHorizon(asset, dir) {
  var hs = horizonsFor(asset), best = hs[0], most = -1;
  hs.forEach(function (n) {
    var k = cardsFor(asset, dir, n).length;
    if (k > most) { most = k; best = n; }
  });
  return best;
}

function setAsset(a) {
  S.asset = a;
  var hs = horizonsFor(a);
  if (hs.indexOf(S.days) < 0 || !cardsFor(a, S.dir, S.days).length) S.days = bestHorizon(a, S.dir);
  S.picked = null;
  render();
}
function setDir(d) {
  S.dir = d;
  if (!cardsFor(S.asset, d, S.days).length) S.days = bestHorizon(S.asset, d);
  S.picked = null;
  render();
}
function setDays(n) { S.days = n; S.picked = null; render(); }
function pick(strike) {
  S.picked = strike;
  openCard(strike);
}

/* ---------- chat (shared across variants; seeds follow the picker, Q13) ---------- */
function renderChat() {

    '<div class="msg them"><small>Copilot</small>Pick what you are watching, then a card. You pay the premium up front and that is the whole of what you can lose &mdash; there is no second bill.</div>' +
    '<div class="msg me"><small>You</small>I think ' + a + ' ' + dirWord + ' this week</div>' +
    '<div class="msg them"><small>Copilot</small>Here is every ' + (S.dir === "DOWN" ? "put" : "call") + ' a maker will sell you on ' + a + ' at ' + S.days + ' day' + (S.days > 1 ? "s" : "") + '. Left-most is the longest shot. Try one as a Practice Run first &mdash; it spends nothing.</div>';
  document.getElementById("seeds").innerHTML =

      .map(function (t) { return '<button class="seed">' + esc(t) + "</button>"; }).join("");
}

    "</div>";

function railFor(c) {

/* ================= VARIANT A - BOARD ================= */
function renderA() {

/* ================= VARIANT B - LADDER ================= */
function renderB() {
  var cards = {}, d = depthFor(S.asset);
  cardsFor(S.asset, S.dir, S.days).forEach(function (c) { cards[c.strike] = c; });
  // Every rung in the depth range, so the ladder is the whole book and not just the Deck.

    }

            "<div><span>pays if it lands</span><b>" + usd(c.refPay) + "</b></div>" +
            "<div><span>orders here</span><b>" + c.n + "</b></div>" +

        "</button>"
      : '<div class="lcard empty"><div class="k">' + usd(r.strike) + "</div></div>";
    var row = '<div class="lrow' + (c ? "" : " thin") + '">' + left +

      (body || '<p style="color:var(--ink-3)">No maker is quoting this right now.</p>') + "</div>" + modalHtml();
}

/* ================= VARIANT C - SLIP ================= */

var BRAND = { ETH: "#627EEA", BTC: "#F7931A", SOL: "#14F195", BNB: "#F3BA2F", XRP: "#7B8794", AVAX: "#E84142" };
var GLYPH = { SOL: "◎", BNB: "◆", XRP: "✕", AVAX: "▲" };
var CALM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function mark(sym, size) {
  var s = size || 26, r = s / 2, c = BRAND[sym], inner;
  if (sym === "ETH") {
    inner = '<g transform="translate(' + r + "," + r + ") scale(" + (s / 34) + ')" fill="#fff">' +
      '<path d="M0 -12 L7.2 0.3 L0 4.6 L-7.2 0.3 Z" opacity=".95"/>' +
      '<path d="M0 6.1 L7.2 1.8 L0 12 L-7.2 1.8 Z" opacity=".6"/></g>';
  } else if (sym === "BTC") {
    inner = '<text x="' + r + '" y="' + (r + s * 0.235) + '" text-anchor="middle" fill="#fff" ' +
      'font-family="IBM Plex Sans" font-weight="700" font-size="' + s * 0.66 + '">₿</text>';
  } else {
    inner = '<text x="' + r + '" y="' + (r + s * 0.2) + '" text-anchor="middle" fill="#0A0E14" ' +
      'font-family="IBM Plex Sans" font-weight="700" font-size="' + s * 0.54 + '">' + GLYPH[sym] + "</text>";
  }
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + " " + s + '" aria-hidden="true">' +
    '<circle cx="' + r + '" cy="' + r + '" r="' + r + '" fill="' + c + '"/>' + inner + "</svg>";
}

/** The move the options market itself is pricing. An observation, not a Forecast. */
function impliedMove(asset, days) {
  var spot = BOOK.spot[asset], best = null, gap = Infinity;
  BOOK.assets[asset].forEach(function (o) {
    if (o.days !== days || !o.iv) return;
    var g = Math.abs(o.strike - spot);
    if (g < gap) { gap = g; best = o; }
  });
  if (!best) return null;
  var T = Math.max((best.expiry * 1000 - TAKEN) / (365 * 86400000), 1 / 8760);
  return spot * best.iv * Math.sqrt(T);
}

/** The arc IS the number; the digits are a label on it, not the only cue. */
function dial(chance, size) {
  var s = size || 62, r = (s - 9) / 2, cx = s / 2, C = 2 * Math.PI * r;
  var col = chance === null ? "var(--ink-3)" : "var(--r" + Math.max(rampStep(chance), 2) + ")";
  var off = C * (chance === null ? 0 : chance);
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + " " + s + '" aria-hidden="true">' +
    '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="5"/>' +
    '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="5"' +
      ' stroke-linecap="round" stroke-dasharray="' + off + " " + C + '" stroke-dashoffset="' + (CALM ? 0 : off) + '"' +
      ' transform="rotate(-90 ' + cx + " " + cx + ')">' +
      (CALM ? "" : '<animate attributeName="stroke-dashoffset" from="' + off + '" to="0" dur="0.7s" fill="freeze"/>') +
    "</circle>" +
    '<text x="' + cx + '" y="' + (cx + 5) + '" text-anchor="middle" fill="var(--ink)" ' +
      'font-family="Martian Mono" font-weight="700" font-size="14" letter-spacing="-1.2">' +
      (chance === null ? "?" : Math.round(chance * 100) + "%") + "</text></svg>";
}

/** The payoff line: flat at the loss, then the kink at the strike. */
function payoffSpark(c, spot, w, h) {
  var lo = Math.min(c.strike, spot) * 0.96, hi = Math.max(c.strike, spot) * 1.04;
  var pts = [], n = 40, peak = c.contracts * (hi - lo) * 0.55 || 1;
  for (var i = 0; i <= n; i++) {
    var p = lo + ((hi - lo) * i) / n;
    var v = c.contracts * Math.max(0, c.isCall ? p - c.strike : c.strike - p) - STAKE;
    pts.push([(i / n) * w, h - ((v + STAKE) / (peak + STAKE)) * h * 0.9]);
  }
  var dstr = pts.map(function (q, i) { return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" ");
  var col = c.isCall ? "var(--call)" : "var(--put)";
  return '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + dstr + " L" + w + " " + h + " L0 " + h + ' Z" fill="' + col + '" opacity=".07"/>' +
    '<path d="' + dstr + '" fill="none" stroke="' + col + '" stroke-width="1.6" opacity=".32"/></svg>';
}

/* ---------- the Slip shell, shared by C (expert) and D (beginner) ---------- */

function slipRail() {
  return ASSETS.map(function (a) {
    var d = depthFor(a), call = 0, put = 0;
    d.bars.forEach(function (b) { call += b.call; put += b.put; });
    var tot = call + put || 1;
    return '<button class="trow" aria-pressed="' + (S.asset === a) + '" onclick="setAsset(\'' + a + '\')">' +
      '<span class="mk">' + mark(a, 26) + "</span><b>" + a + "</b><span>" + usd(BOOK.spot[a]) + "</span>" +
      '<span class="sp"><i style="width:' + (call / tot) * 100 + '%;background:var(--call)"></i>' +
      '<i style="width:' + (put / tot) * 100 + '%;background:var(--put)"></i></span></button>';
  }).join("");
}

function slipChips() {
  return '<div class="chips">' +
    '<button class="chip down" aria-pressed="' + (S.dir === "DOWN") + '" onclick="setDir(\'DOWN\')">&#9662; Falls</button>' +
    '<button class="chip up" aria-pressed="' + (S.dir === "UP") + '" onclick="setDir(\'UP\')">&#9652; Rises</button>' +
    '<span class="sep"></span>' +
    horizonsFor(S.asset).map(function (n) {
      // A horizon nobody quotes this way is shown dead, not hidden: the book's shape
      // is information, and a chip that vanishes reads as a bug.
      var live = cardsFor(S.asset, S.dir, n).length > 0;
      return '<button class="chip' + (live ? "" : " dead") + '" aria-pressed="' + (S.days === n) + '"' +
        (live ? ' onclick="setDays(' + n + ')"' : ' disabled title="no maker quotes this direction at this expiry"') +
        ">" + n + "d</button>";
    }).join("") +
    '<button class="rfqbtn" onclick="openRfq()"><i>+</i> Name your own strike</button></div>';
}

function slipShell(tiles, heroLine) {
  return '<div class="rail-top">' + slipRail() + "</div>" +
    '<div class="hero"><span class="ghost">' + mark(S.asset, 148) + "</span>" +
      "<h2>" + mark(S.asset, 30) + S.asset + '<span class="px">' + usd(BOOK.spot[S.asset]) + "</span></h2>" +
      '<p class="move">' + heroLine + "</p></div>" +
    '<div class="body">' + slipChips() +
      '<div class="tiles">' + (tiles || '<p style="color:var(--ink-3)">No maker is quoting this. Try another expiry.</p>') + "</div>" +
      '<div class="evidence"><header><h3>Where makers will trade</h3>' +
        '<span id="dread" class="dread"></span>' +
        '<span class="key"><span><i style="background:var(--call)"></i>calls</span>' +
        '<span><i style="background:var(--put)"></i>puts</span>' +
        '<span><i class="dot"></i>open positions</span></span></header>' +
        depthChart(S.asset, S.days, 190) + "</div>" +
    "</div>" + modalHtml();
}

/** Everything both tiles need, derived once. */
function tileFacts(c, spot, ref) {
  var pay = c.contracts * Math.max(0, c.isCall ? ref - c.strike : c.strike - ref);
  return {
    pay: pay,
    be: c.isCall ? c.strike + c.px : c.strike - c.px,
    held: oiAt(S.asset, c.strike),
    /**
     * How far the market still has to travel to reach the strike, signed.
     * Negative means it is already past it -- such a Card needs no move, only
     * that the price stays where it is, which is a different thing to say.
     */
    needPct: (c.isCall ? (c.strike - spot) / spot : (spot - c.strike) / spot) * 100
  };
}

/* ================= VARIANT C - SLIP (the expert framing) ================= */
function renderC() {
  var rows = cardsFor(S.asset, S.dir, S.days), spot = BOOK.spot[S.asset];
  var mv = impliedMove(S.asset, S.days);
  var ref = mv === null ? spot * (S.dir === "UP" ? 1.04 : 0.96) : spot + (S.dir === "UP" ? mv : -mv);
  var maxDepth = 0;
  depthFor(S.asset).bars.forEach(function (b) { maxDepth = Math.max(maxDepth, b.call + b.put); });

  var tiles = rows.map(function (c) {
    var f = tileFacts(c, spot, ref);
    var beMove = ((f.be - spot) / spot) * 100;
    var odds =
      '<div class="mult"><span class="x' + (f.pay > 0 ? "" : " nil") + '">&times;' + (f.pay / STAKE).toFixed(1) + "</span>" +
      '<span class="to">Max Loss ' + usd(STAKE) + " &rarr; <b>" + usd(f.pay) + "</b><br>at the expected move</span></div>" +
      '<div class="be' + (f.pay > 0 ? "" : " lead") + '"><span>break-even</span><b>' + usd(f.be) + "</b>" +
      "<em>" + (beMove > 0 ? "+" : "") + beMove.toFixed(1) + "%</em></div>";
    return '<button class="tile" aria-pressed="' + (S.picked === c.strike) + '" onclick="pick(' + c.strike + ')">' +
      '<i class="rail" style="background:var(--' + (c.isCall ? "call" : "put") + ')"></i>' +
      '<span class="wm">' + payoffSpark(c, spot, 240, 78) + "</span>" +
      '<div class="gauge">' + dial(c.chance, 62) +
        '<div class="g-txt"><small>Implied Chance</small><b>' + chanceWords(c.chance) + "</b></div></div>" +
      '<div class="claim">' + (c.isCall ? "above " : "below ") + "<b>" + usd(c.strike) + "</b></div>" +
      odds +
      '<div class="foot"><span class="heat" title="' + c.n + " resting order" + (c.n > 1 ? "s" : "") +
        " here, " + big(c.depth) + ' available"><i style="width:' +
        Math.max(8, Math.min(100, (c.depth / (maxDepth || 1)) * 100)) + '%"></i></span>' +
        '<span class="hn">' + c.n + " offer" + (c.n > 1 ? "s" : "") + "</span>" +
        (f.held ? '<span class="held" title="' + f.held + ' traders hold this strike right now">' + f.held + " held</span>" : "") +
        ticker(c) + "</div></button>";
  }).join("");

  return slipShell(tiles, mv === null
    ? "No volatility quoted at this expiry."
    : "Market is pricing <b>&plusmn;" + usd(mv) + "</b> over " + S.days + "d. Payouts quoted at <b>" + usd(ref) + "</b>.");
}

/* ================= VARIANT D - PLAIN (the beginner framing) =================
   Three questions and nothing else: how likely, how far by when, what do I risk
   against what do I win. Every number that answered a fourth question is gone. */
function renderD() {
  var rows = cardsFor(S.asset, S.dir, S.days), spot = BOOK.spot[S.asset];
  var mv = impliedMove(S.asset, S.days);
  var ref = mv === null ? spot * (S.dir === "UP" ? 1.04 : 0.96) : spot + (S.dir === "UP" ? mv : -mv);
  var verb = S.dir === "UP" ? "rise" : "fall";

  var tiles = rows.map(function (c) {
    var f = tileFacts(c, spot, ref);
    // A payout under the stake is a loss. Saying "x0.9" and leaving a beginner to
    // notice the crossing at 1.0 is the single most misleading thing the expert
    // tile does, so here it is spelled out in words instead.
    var note = f.pay === 0 ? "pays nothing at the expected move"
             : f.pay < STAKE ? "pays back less than you risk"
             : "";
    return '<button class="tile d" aria-pressed="' + (S.picked === c.strike) + '" onclick="pick(' + c.strike + ')"' +
      ' title="' + c.n + " maker offer" + (c.n > 1 ? "s" : "") + " here, " + big(c.depth) + ' available">' +
      '<i class="rail" style="background:var(--' + (c.isCall ? "call" : "put") + ')"></i>' +
      '<div class="gauge">' + dial(c.chance, 58) +
        '<div class="g-txt"><small>Implied Chance</small><b>' + chanceWords(c.chance) + "</b></div></div>" +
      '<div class="must">' + (f.needPct > 0
        ? '<span class="lead">' + S.asset + " must " + verb + "</span>" +
          '<b class="pc">' + f.needPct.toFixed(1) + "%</b>" +
          '<span class="sub">to ' + usd(c.strike) + " &middot; in " + ticker(c) + "</span>"
        : '<span class="lead">' + S.asset + " is already " + (c.isCall ? "above" : "below") + "</span>" +
          '<b class="pc sm">' + usd(c.strike) + "</b>" +
          '<span class="sub">it just has to stay there &middot; ' + ticker(c) + "</span>") + "</div>" +
      '<div class="rw"><div><small>Risk</small><b>' + usd(STAKE) + "</b></div>" +
        '<span class="arw">&rarr;</span>' +
        '<div><small>Win</small><b class="' + (f.pay >= STAKE ? "win" : "lose") + '">' + usd(f.pay) + "</b></div></div>" +
      '<div class="dnote">' + (note ? '<span class="warn">' + note + "</span>" : "") +
        (f.held ? '<span class="held" title="' + f.held + ' traders hold this strike right now">' + f.held + " held</span>" : "") +
      "</div></button>";
  }).join("");

  return slipShell(tiles, mv === null
    ? "No volatility quoted at this expiry."
    : "Most traders expect " + S.asset + " to move about <b>&plusmn;" + usd(mv) + "</b> over the next " +
      S.days + " day" + (S.days > 1 ? "s" : "") + ". Every <b>Win</b> below assumes exactly that.");
}

/* ---------- size, strike and expiry controls ------------------------------
   A stepper alone made a Trader click eleven times to reach $10, and a number
   field for the strike gave no sense of where it sat relative to spot. Presets
   carry the common cases, the slider carries the relationship, and the stepper
   is left for the last fifty cents. */

var SIZE_STEP = 0.5, SIZE_MIN = 0.5, SIZE_PRESETS = [1, 2, 5, 10];
var RFQ_BAND = 0.3;   // an RFQ may name any strike within +/-30% of spot
var RFQ_TENORS = [7, 14, 30, 60];

function openCard(strike) { S.modal = { kind: "card", strike: strike }; S.size = STAKE; S.receipt = null; render(); }
function openRfq() {
  S.modal = { kind: "rfq" };
  S.size = STAKE;
  S.receipt = null;
  if (!S.rfqForm) S.rfqForm = { strike: null, days: 14 };
  render();
}
function closeModal() { S.modal = null; S.receipt = null; render(); }

function sizeCap() {
  var lim = RISK_BUDGET - S.spent, c = modalCard();
  if (c) lim = Math.min(lim, c.depth);
  return Math.max(SIZE_MIN, Math.round(lim * 100) / 100);
}
function setSize(v) { S.size = Math.max(SIZE_MIN, Math.min(sizeCap(), Math.round(v * 100) / 100)); render(); }
function bumpSize(d) { setSize(S.size + d); }
function modalCard() {
  if (!S.modal || S.modal.kind !== "card") return null;
  var rows = cardsFor(S.asset, S.dir, S.days);
  for (var i = 0; i < rows.length; i++) if (rows[i].strike === S.modal.strike) return rows[i];
  return null;
}

/** The strike an RFQ is currently asking for. */
function rfqStrike() {
  var spot = BOOK.spot[S.asset];
  if (S.rfqForm && S.rfqForm.strike) return S.rfqForm.strike;
  return roundStrike(spot * (S.dir === "DOWN" ? 0.9 : 1.1));
}
function roundStrike(v) {
  var mag = Math.pow(10, Math.floor(Math.log10(v)) - 2);   // ~3 significant figures
  return Math.round(v / mag) * mag;
}
/** Dragging updates the sentence in place; only the release re-renders. */
function dragStrike(pct) {
  var v = roundStrike(BOOK.spot[S.asset] * (1 + pct / 100));
  var a = document.getElementById("beliefStrike"), b = document.getElementById("strikeOff");
  if (a) a.textContent = usd(v);
  if (b) b.textContent = (pct > 0 ? "+" : "") + Number(pct).toFixed(1) + "%";
}
function commitStrike(pct) {
  S.rfqForm.strike = roundStrike(BOOK.spot[S.asset] * (1 + pct / 100));
  render();
}
function setTenor(n) { S.rfqForm.days = n; render(); }

function sizeControl() {
  var cap = sizeCap(), used = (S.size / RISK_BUDGET) * 100;
  return '<div class="ctl"><div class="ctlhead"><span class="mk2">Size</span>' +
    '<div class="stepper">' +
      '<button onclick="bumpSize(-' + SIZE_STEP + ')"' + (S.size <= SIZE_MIN ? " disabled" : "") + ">&minus;</button>" +
      "<b>" + usd(S.size) + "</b>" +
      '<button onclick="bumpSize(' + SIZE_STEP + ')"' + (S.size >= cap ? " disabled" : "") + ">+</button>" +
    "</div></div>" +
    '<div class="presets">' +
      SIZE_PRESETS.map(function (v) {
        return '<button class="pre" aria-pressed="' + (S.size === v) + '"' +
          (v > cap ? " disabled" : ' onclick="setSize(' + v + ')"') + ">" + usd(v) + "</button>";
      }).join("") +
      '<button class="pre" aria-pressed="' + (S.size === cap) + '" onclick="setSize(' + cap + ')">Max</button>' +
    "</div>" +
    '<div class="bud"><span class="budbar"><i style="width:' + Math.min(100, used) + '%"></i></span>' +
      usd(S.size) + " of " + usd(RISK_BUDGET) + " risk budget</div></div>";
}

function strikeControl() {
  var spot = BOOK.spot[S.asset], k = rfqStrike();
  var pct = ((k - spot) / spot) * 100;
  var lo = -RFQ_BAND * 100, hi = RFQ_BAND * 100;
  return '<div class="ctl"><div class="ctlhead"><span class="mk2">Strike</span>' +
    '<span class="off">spot ' + usd(spot) + ' &middot; <b id="strikeOff">' +
      (pct > 0 ? "+" : "") + pct.toFixed(1) + "%</b></span></div>" +
    '<input class="slider" type="range" min="' + lo + '" max="' + hi + '" step="0.5" value="' + pct.toFixed(1) + '"' +
      ' oninput="dragStrike(this.value)" onchange="commitStrike(this.value)"' +
      ' aria-label="Strike, as a percentage from spot">' +
    '<div class="scale"><span>&minus;30%</span><span class="mid">spot</span><span>+30%</span></div></div>';
}

function tenorControl() {
  var days = (S.rfqForm && S.rfqForm.days) || 14;
  return '<div class="ctl"><div class="ctlhead"><span class="mk2">Expires in</span>' +
    '<span class="off">the book stops at 3 days</span></div>' +
    '<div class="presets wide">' + RFQ_TENORS.map(function (n) {
      return '<button class="pre" aria-pressed="' + (n === days) + '" onclick="setTenor(' + n + ')">' + n + " days</button>";
    }).join("") + "</div></div>";
}

/* ---------- the modals ---------- */
function modalHtml() {
  if (!S.modal) return "";
  return '<div class="scrim" onclick="closeModal()"></div>' +
    '<div class="modal" role="dialog" aria-modal="true" aria-label="Confirm">' +
      (S.modal.kind === "card" ? cardModal() : rfqModal()) + "</div>";
}
function modalHead(sub) {
  return '<header><span class="mk">' + mark(S.asset, 30) + "</span>" +
    "<div><b>" + S.asset + " " + usd(BOOK.spot[S.asset]) + "</b><small>" + sub + "</small></div>" +
    '<button class="x" onclick="closeModal()" aria-label="Close">&times;</button></header>';
}
function belief(dirWord, value, tail) {
  return '<div class="belief">You believe <em>' + S.asset + "</em> will be<br>" +
    "<em>" + dirWord + "</em> <em>" + value + "</em><br>in <em>" + tail + "</em></div>";
}

function cardModal() {
  var c = modalCard();
  if (!c) return modalHead("gone") + '<div class="belief">That Card is no longer on the book.</div>';
  var spot = BOOK.spot[S.asset], mv = impliedMove(S.asset, S.days);
  var ref = mv === null ? spot * (S.dir === "UP" ? 1.04 : 0.96) : spot + (S.dir === "UP" ? mv : -mv);
  var contracts = S.size / c.px;
  var pay = contracts * Math.max(0, c.isCall ? ref - c.strike : c.strike - ref);

  return modalHead(c.isCall ? "CALL" : "PUT") +
    belief(c.isCall ? "above" : "below", usd(c.strike),
      '<span class="ticks" data-exp="' + c.expiry + '" data-fmt="hms"></span>') +
    sizeControl() +
    '<div class="sub2">' + contracts.toFixed(4) + " contracts at " + usd(c.px) + " each</div>" +
    "<dl>" +
      '<dt>Max Loss</dt><dd class="hero">' + usd(S.size) + "</dd>" +
      "<dt>Chance it pays</dt><dd>" + (c.chance === null ? "&mdash;" : Math.round(c.chance * 100) + "% &middot; " + chanceWords(c.chance)) + "</dd>" +
      "<dt>Pays if it lands on the expected move</dt><dd>" + usd(pay) + "</dd>" +
      "<dt>Maker depth here</dt><dd>" + big(c.depth) + " &middot; " + c.n + " offer" + (c.n > 1 ? "s" : "") + "</dd>" +
    "</dl>" + receiptHtml() +
    '<footer><button class="btn primary" onclick="commitPractice()">Practice Run &middot; spends nothing</button>' +
      '<button class="btn ghost" onclick="commitReal()">Confirm &middot; ' + usd(S.size) + "</button></footer>";
}

function rfqModal() {
  var falls = S.dir === "DOWN", days = (S.rfqForm && S.rfqForm.days) || 14;
  return modalHead("REQUEST A QUOTE") +
    belief(falls ? "below" : "above",
      '<span id="beliefStrike">' + usd(rfqStrike()) + "</span>", days + " days") +
    strikeControl() + tenorControl() + sizeControl() +
    "<dl>" +
      '<dt>Max Loss</dt><dd class="hero">' + usd(S.size) + "</dd>" +
      '<dt>Premium</dt><dd class="muted">not priced yet</dd>' +
      '<dt>Chance it pays</dt><dd class="muted">not priced yet</dd>' +
    "</dl>" +
    '<p class="mnote">Your size is the <b>reserve price</b> &mdash; the most you will pay. It is enforced ' +
      "on-chain, so this ceiling holds whatever a maker quotes. No premium is shown because there is not " +
      "one yet: an RFQ has no price until an Offer answers it.</p>" +
    receiptHtml() +
    '<footer><button class="btn primary" onclick="sendRfq()">Request quotes</button>' +
      '<button class="btn ghost" onclick="closeModal()">Cancel</button></footer>';
}

function commitPractice() { S.receipt = { kind: "practice", size: S.size }; render(); }
function commitReal() { S.receipt = { kind: "blocked", size: S.size }; render(); }
function sendRfq() {
  S.receipt = {
    kind: "rfq501", strike: rfqStrike(), days: (S.rfqForm && S.rfqForm.days) || 14, size: S.size,
    message: "POST /rfq answered 501 Not Implemented. The sealed-bid RFQ backend is a separate " +
             "issue. Nothing was sent to a maker, nothing was signed, and no USDC moved."
  };
  render();
}

function receiptHtml() {
  var r = S.receipt;
  if (!r) return "";
  if (r.kind === "practice")
    return '<div class="receipt ok" role="status"><b>Practice Position opened</b><p>' + usd(r.size) +
      " simulated. No USDC moved and nothing was signed &mdash; /practice cannot reach a signer at all.</p></div>";
  if (r.kind === "blocked")
    return '<div class="receipt" role="status"><b>Prototype &middot; no signer here</b><p>In the real surface ' +
      "this is the one place a signature happens, against a proposalId the server minted. This page holds " +
      "no key and spends nothing.</p></div>";
  return '<div class="receipt" role="alert"><b>501 &middot; not built yet</b><p>' + r.message + "</p>" +
    '<p class="echo">You asked for: ' + S.asset + " " + (S.dir === "DOWN" ? "below " : "above ") +
    usd(r.strike) + ", " + r.days + " days, at most " + usd(r.size) + ".</p></div>";
}

/* ================= VARIANT E - TERMINAL =====================================
   Variant A's hierarchy (the chart leads) with C's ticker rail, and the tile
   rewritten as a labelled data sheet: strike, distance, premium, depth, held.
   Chance survives the cull but loses its jargon - on this tile it is only ever
   called "chance it pays", because a Deck with no odds on it teaches a beginner
   to buy the cheapest thing on the board. */

/** Cumulative depth walking away from spot, the way an order book is read. */
function cumulative(d) {
  var up = [], dn = [], run = 0, i;
  var above = d.bars.filter(function (b) { return b.strike >= d.spot; });
  var below = d.bars.filter(function (b) { return b.strike < d.spot; }).reverse();
  for (i = 0; i < above.length; i++) { run += above[i].call; up.push([above[i].strike, run]); }
  run = 0;
  for (i = 0; i < below.length; i++) { run += below[i].put; dn.push([below[i].strike, run]); }
  var max = 0;
  up.concat(dn).forEach(function (p) { max = Math.max(max, p[1]); });
  return { up: up, dn: dn, max: max || 1 };
}

function depthChartPro(asset, days, h) {
  var d = depthFor(asset), cum = cumulative(d);
  var W = 1000, H = h || 280, padL = 18, padR = 70, padT = 20, padB = 40;
  var midY = padT + (H - padT - padB) / 2;
  var half = (H - padT - padB) / 2;
  var span = d.hi - d.lo;
  var x = function (s) { return padL + ((s - d.lo) / span) * (W - padL - padR); };
  var gap = Infinity;
  for (var g = 1; g < d.bars.length; g++) gap = Math.min(gap, x(d.bars[g].strike) - x(d.bars[g - 1].strike));
  if (!isFinite(gap)) gap = 40;
  var barW = Math.min(20, Math.max(3, gap * 0.66));
  CHART = { d: d, W: W, padL: padL, x: x, asset: asset };

  var s = [];
  s.push('<svg id="dchart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet" ' +
    'style="width:100%;height:auto;display:block">');

  // grid, with the depth scale on the right where a terminal puts its axis
  [1, 0.5, 0, -0.5, -1].forEach(function (f) {
    var y = midY - f * half;
    s.push('<line class="' + (f === 0 ? "axis" : "gridline") + '" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '"/>');
    s.push('<text class="tick" x="' + (W - padR + 8) + '" y="' + (y + 3.5) + '">' + big(Math.abs(f) * d.max) + "</text>");
  });
  s.push('<line class="axis" x1="' + (W - padR) + '" y1="' + padT + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '"/>');
  s.push('<text class="axlbl" x="' + (padL + 3) + '" y="' + (padT + 11) + '">CALLS &#9650;</text>');
  s.push('<text class="axlbl" x="' + (padL + 3) + '" y="' + (H - padB - 5) + '">PUTS &#9660;</text>');
  s.push('<text class="axttl" x="' + (W - padR + 8) + '" y="' + (padT - 7) + '">USDC</text>');
  s.push('<text class="axttl" x="' + (padL + 3) + '" y="' + (padT - 7) + '">MAKER DEPTH &middot; cumulative shown as a line</text>');

  // cumulative curves, stepped, scaled to their own maximum
  var step = function (pts, sign) {
    if (!pts.length) return "";
    var pth = "M" + x(pts[0][0]).toFixed(1) + " " + midY.toFixed(1), prev = midY;
    pts.forEach(function (p) {
      var y = midY - sign * (p[1] / cum.max) * half * 0.96;
      pth += " L" + x(p[0]).toFixed(1) + " " + prev.toFixed(1) +
             " L" + x(p[0]).toFixed(1) + " " + y.toFixed(1);
      prev = y;
    });
    return pth;
  };
  var upPath = step(cum.up, 1), dnPath = step(cum.dn, -1);
  if (upPath) s.push('<path class="cum call" d="' + upPath + '"/>');
  if (dnPath) s.push('<path class="cum put" d="' + dnPath + '"/>');

  d.bars.forEach(function (b) {
    var cx = x(b.strike), lit = b.days[days] ? "" : " dim";
    var hc = (b.call / d.max) * half, hp = (b.put / d.max) * half;
    if (hc > 0) s.push('<rect class="bar' + lit + '" x="' + (cx - barW / 2) + '" y="' + (midY - hc) + '" width="' + barW + '" height="' + hc + '" fill="var(--call)" rx="1"/>');
    if (hp > 0) s.push('<rect class="bar' + lit + '" x="' + (cx - barW / 2) + '" y="' + midY + '" width="' + barW + '" height="' + hp + '" fill="var(--put)" rx="1"/>');
    var n = oiAt(asset, b.strike);
    if (n) s.push('<circle class="oi" cx="' + cx + '" cy="' + (H - padB + 11) + '" r="' + Math.min(7, 2.6 + n * 0.35) + '"/>');
  });

  // spot, with a chip rather than loose text
  var sx = x(d.spot), lbl = usd(d.spot), wlbl = lbl.length * 6.2 + 12;
  s.push('<line class="spotline" x1="' + sx + '" y1="' + padT + '" x2="' + sx + '" y2="' + (H - padB) + '"/>');
  s.push('<rect class="spotchip" x="' + (sx + 5) + '" y="' + (padT - 13) + '" width="' + wlbl + '" height="15" rx="3"/>');
  s.push('<text class="spotchiptx" x="' + (sx + 11) + '" y="' + (padT - 2) + '">' + lbl + "</text>");

  s.push('<line class="axis" x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '"/>');
  for (var i = 0; i <= 6; i++) {
    var st = d.lo + (span * i) / 6, tx = x(st);
    s.push('<line class="gridline" x1="' + tx + '" y1="' + (H - padB) + '" x2="' + tx + '" y2="' + (H - padB + 4) + '"/>');
    s.push('<text class="tick" x="' + tx + '" y="' + (H - padB + 26) + '" text-anchor="middle">' + usd(st) + "</text>");
  }
  if (d.outside) s.push('<text class="outside" x="' + (W - padR) + '" y="' + (H - 3) + '" text-anchor="end">' + d.outside + " outside range</text>");

  s.push('<line id="xh" class="xhair" x1="0" y1="' + padT + '" x2="0" y2="' + (H - padB) + '" opacity="0"/>');
  s.push('<rect x="' + padL + '" y="' + padT + '" width="' + (W - padL - padR) + '" height="' + (H - padT - padB) +
    '" fill="transparent" onmousemove="xhairPro(event)" onmouseleave="xhairOff()"/>');
  s.push("</svg>");
  return s.join("");
}

/** Crosshair with a floating readout, positioned in page space over the chart. */
function xhairPro(e) {
  var svg = document.getElementById("dchart"), tip = document.getElementById("dtip");
  if (!CHART || !svg || !tip) return;
  var r = svg.getBoundingClientRect();
  var xs = ((e.clientX - r.left) / r.width) * CHART.W;
  var best = null, gap = Infinity;
  CHART.d.bars.forEach(function (b) { var g = Math.abs(CHART.x(b.strike) - xs); if (g < gap) { gap = g; best = b; } });
  if (!best) return;
  var line = document.getElementById("xh"), bx = CHART.x(best.strike);
  line.setAttribute("x1", bx); line.setAttribute("x2", bx); line.setAttribute("opacity", "1");
  var held = oiAt(CHART.asset, best.strike);
  tip.innerHTML = "<b>" + usd(best.strike) + "</b>" +
    '<span><i style="background:var(--call)"></i>calls</span><em>' + (best.call ? big(best.call) + " / " + best.nc : "&mdash;") + "</em>" +
    '<span><i style="background:var(--put)"></i>puts</span><em>' + (best.put ? big(best.put) + " / " + best.np : "&mdash;") + "</em>" +
    (held ? '<span><i class="dot"></i>held</span><em>' + held + "</em>" : "");
  var host = svg.parentElement.getBoundingClientRect();
  var px = (bx / CHART.W) * r.width + (r.left - host.left);
  tip.style.left = Math.min(Math.max(px + 14, 8), host.width - 178) + "px";
  tip.style.top = Math.max(e.clientY - host.top - 30, 8) + "px";
  tip.style.opacity = "1";
}

function renderE() {
  var rows = cardsFor(S.asset, S.dir, S.days), spot = BOOK.spot[S.asset];
  var mv = impliedMove(S.asset, S.days);
  var d = depthFor(S.asset), call = 0, put = 0, oiTot = 0;
  d.bars.forEach(function (b) { call += b.call; put += b.put; oiTot += oiAt(S.asset, b.strike); });

  var stat = function (k, v, cls) {
    return '<div class="st"><small>' + k + "</small><b" + (cls ? ' class="' + cls + '"' : "") + ">" + v + "</b></div>";
  };
  var stats = '<div class="statbar">' +
    stat("Spot", usd(spot)) +
    stat("Expected move &middot; " + S.days + "d", mv === null ? "&mdash;" : "&plusmn;" + usd(mv)) +
    stat("Call depth", big(call), "up") +
    stat("Put depth", big(put), "dn") +
    stat("Put / call", call ? (put / call).toFixed(2) : "&mdash;") +
    stat("Strikes", String(d.bars.length)) +
    stat("Open positions", String(oiTot)) +
    "</div>";

  var maxDepth = 0;
  d.bars.forEach(function (b) { maxDepth = Math.max(maxDepth, b.call + b.put); });

  var tiles = rows.map(function (c) {
    var f = tileFacts(c, spot, spot);
    var verb = c.isCall ? "rise" : "fall";
    var dist = f.needPct > 0
      ? "must " + verb + " <b>" + f.needPct.toFixed(1) + "%</b>"
      : "already " + (c.isCall ? "above" : "below") + " &mdash; <b>must stay</b>";
    return '<button class="tile e" aria-pressed="' + (S.picked === c.strike) + '" onclick="pick(' + c.strike + ')">' +
      '<i class="rail" style="background:var(--' + (c.isCall ? "call" : "put") + ')"></i>' +
      '<div class="etop"><div><div class="k">' + usd(c.strike) + "</div>" +
        '<div class="dist">' + dist + "</div></div>" +
        '<div class="ch">' + dial(c.chance, 46) + "<small>chance<br>it pays</small></div></div>" +
      "<dl>" +
        "<dt>Premium</dt><dd>" + usd(c.px) + ' <span class="u">/ contract</span></dd>' +
        "<dt>You pay</dt><dd>" + usd(STAKE) + ' <span class="u">for ' + c.contracts.toFixed(4) + "</span></dd>" +
        '<dt>Maker depth</dt><dd><span class="hbar"><i style="width:' +
          Math.max(6, Math.min(100, (c.depth / (maxDepth || 1)) * 100)) + '%"></i></span>' + big(c.depth) +
          ' <span class="u">&middot; ' + c.n + " offer" + (c.n > 1 ? "s" : "") + "</span></dd>" +
        "<dt>Held now</dt><dd>" + (f.held ? f.held + ' <span class="u">trader' + (f.held > 1 ? "s" : "") + "</span>" : '<span class="u">nobody yet</span>') + "</dd>" +
      "</dl>" +
      '<div class="efoot"><span class="lbl">expires in</span>' + ticker(c) + "</div></button>";
  }).join("");

  return '<div class="rail-top">' + slipRail() + "</div>" + stats +
    '<div class="chartwrap"><div id="dtip" class="dtip"></div>' + depthChartPro(S.asset, S.days, 170) + "</div>" +
    '<div class="body">' + slipChips() +
      '<div class="tiles">' + (tiles || '<p style="color:var(--ink-3)">No maker is quoting this. Try another expiry, or name your own above.</p>') + "</div>" +
          "</div>" + modalHtml();
}

/* ---------- render + switcher ---------- */
function render() {
  var rig = document.getElementById("rig");
  // D borrows every .C shell rule and overrides only the tile.
  // D and E both borrow the .C shell rules and override only what differs.
  rig.className = "rig " + (S.variant === "D" ? "C D" : S.variant === "E" ? "C E" : S.variant);
  rig.innerHTML = S.variant === "A" ? renderA()
    : S.variant === "B" ? renderB()
    : S.variant === "C" ? renderC()
    : S.variant === "D" ? renderD()
    : renderE();
  renderChat();
  var v = VARIANTS.filter(function (x) { return x.key === S.variant; })[0];
  document.getElementById("vname").innerHTML = v.key + " &mdash; " + v.name + " <em>" + v.hint + "</em>";
  tick();
}

function tick() {
  var now = Date.now();
  Array.prototype.forEach.call(document.querySelectorAll("[data-exp]"), function (el) {
    var exp = Number(el.getAttribute("data-exp"));
    var c = countdown(exp);
    if (el.getAttribute("data-fmt") === "hms") {
      var ms = Math.max(0, exp * 1000 - now), t = Math.floor(ms / 1000);
      el.textContent = String(Math.floor(t / 3600)).padStart(2, "0") + ":" +
        String(Math.floor(t / 60) % 60).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
      el.className = "ticks";
      return;
    }
    el.textContent = c.text;
    el.className = "ticks" + (c.hot ? "" : " cold");
  });
}
setInterval(tick, 1000);

function go(step) {
  var i = VARIANTS.findIndex(function (x) { return x.key === S.variant; });
  S.variant = VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length].key;
  var q = new URLSearchParams(location.search);
  q.set("variant", S.variant);
  history.replaceState(null, "", location.pathname + "?" + q.toString());
  render();
}
document.getElementById("prev").onclick = function () { go(-1); };
document.getElementById("next").onclick = function () { go(1); };
document.addEventListener("keydown", function (e) {
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "Escape" && S.modal) { closeModal(); return; }
  if (S.modal) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

// Open on the fullest expiry. 1 day is routinely the thinnest cell in the book and
// makes the surface look emptier than it is.
S.days = bestHorizon("ETH", S.dir);
setAsset("ETH");
</script>
